<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="navbar" class="navbar">
        <div class="container-fluid">
            <!-- Link dinâmico baseado no tipo de usuário, replicando a lógica de redirecionar.php -->
            <a th:with="tipoUsuario=${session.tipo != null ? session.tipo : (tipo != null ? tipo : null)}"
               th:href="@{${tipoUsuario != null ? 
                          (tipoUsuario == 0 ? '/pages/aluno/home' : 
                           (tipoUsuario == 1 ? '/pages/preceptor/home' : 
                            (tipoUsuario == 2 || tipoUsuario == 3 ? '/pages/coordenacao/home' : 
                             '/cadastro_e_login/novocadastro'))) : 
                          '/cadastro_e_login/novocadastro'}}" class="nodec">
                <h2 class="navbar-brand">SISTEMA MEDICINA</h2>
            </a>
            <div class="dropdown">

                
                <!-- Exibir o nome com prioridade para session.nome para manter consistência -->
                <span class="navbar-text me-3">
                    Olá, <span th:text="${session.nome != null ? session.nome : (nome != null ? nome : '')}"></span>
                </span>
                <span class="icone-perfil no-caret" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                </span>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item" th:href="@{/includes/perfil}">Perfil</a></li>
                    <li><a class="dropdown-item" href="http://localhost/Interdisciplinar-Med/cadastro_e_login/logout.php">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
