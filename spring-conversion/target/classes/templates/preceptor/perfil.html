<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Preceptor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
        }
        
        main {
            margin-top: 100px;
            padding: 20px;
            margin-left: 80px;
            margin-bottom: 100px;
        }
        
        .navbar {
            background-color: rgb(0, 94, 0);
            height: 100px;
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        
        .navbar-brand,
        .navbar-text {
            color: white;
            font-size: 20px;
        }
        
        .navbar-brand {
            font-size: 30px;
        }
        
        #userDropdown {
            width: 80px;
            height: 80px;
            color: white;
            cursor: pointer;
            object-fit: cover;
        }
        
        #content-main {
            padding: 20px;
            background-color: white;
        }
        
        .footer-home {
            background-color: gray;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            height: 30px;
            bottom: 0;
            z-index: 90;
        }
        
        .navbar .nodec {
            text-decoration: none;
            color: white;
        }
        
        .icone-perfil {
            color: white;
            cursor: pointer;
            font-size: 50px;
            line-height: 30px;
        }
        
        .no-caret::after {
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>
    
    <!-- Menu lateral (usando o fragmento) -->
    <th:block th:replace="~{fragments/menu-lateral-preceptor :: menu-lateral}"></th:block>
    
    <main>
        <div class="container mt-3">
            <div class="card">
                <div class="card-body">
                    <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>

                    <div class="container mt-5">
                        <h2>Informações do Usuário</h2>

                        <form th:action="@{/includes/alterar-dados}" method="POST">
                            <h3>Dados de contato</h3>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${email}" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="telefone" name="telefone" th:value="${telefone}" required>
                            </div>
                            <div class="mb-3">
                                <label for="login" class="form-label">Login</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="login" name="login" th:value="${login}" readonly>
                                    <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#alterarLoginModal">Alterar</button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="senha" name="senha" value="********" readonly>
                                    <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#alterarSenhaModal">Alterar</button>
                                </div>
                            </div>
                            <input type="hidden" name="idusuario" th:value="${idusuario}">
                            <input type="hidden" name="action" value="alterar_dados_contato">
                            <button type="submit" class="btn btn-success">Salvar Alterações</button>
                            <a th:href="@{/pages/preceptor/home}" class="btn btn-secondary">Voltar</a>
                        </form>

                        <!-- Modal para alterar login -->
                        <div class="modal fade" id="alterarLoginModal" tabindex="-1" aria-labelledby="alterarLoginModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="alterarLoginModalLabel">Alterar Login</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form method="POST" th:action="@{/includes/alterar-dados}">
                                            <div class="form-group">
                                                <label for="login_antigo">Login Atual</label>
                                                <input type="text" class="form-control" id="login_antigo" name="login_antigo" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="login_novo">Login Novo</label>
                                                <input type="text" class="form-control" id="login_novo" name="login_novo" required>
                                            </div>
                                            <input type="hidden" name="idusuario" th:value="${idusuario}">
                                            <input type="hidden" name="action" value="alterar_login">
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <button type="submit" class="btn btn-primary">Salvar</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Modal para alterar senha -->
                        <div class="modal fade" id="alterarSenhaModal" tabindex="-1" aria-labelledby="alterarSenhaModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="alterarSenhaModalLabel">Alterar Senha</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form method="POST" th:action="@{/includes/alterar-dados}">
                                            <div class="form-group">
                                                <label for="senha_antiga">Senha Atual</label>
                                                <input type="password" class="form-control" id="senha_antiga" name="senha_antiga" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="senha_nova">Senha Nova</label>
                                                <input type="password" class="form-control" id="senha_nova" name="senha_nova" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="senha_nova_conf">Confirmar Senha Nova</label>
                                                <input type="password" class="form-control" id="senha_nova_conf" name="senha_nova_conf" required>
                                            </div>
                                            <input type="hidden" name="idusuario" th:value="${idusuario}">
                                            <input type="hidden" name="action" value="alterar_senha">
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <button type="submit" class="btn btn-primary">Salvar</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="card footer-home rounded-0">
            <div class="card-body">
                <p class="text-center">&copy; 2025 Interdisciplinar-Med</p>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
