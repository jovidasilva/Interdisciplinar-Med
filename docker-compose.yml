services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: proj_internato
      DB_PORT: 3306
      BASE_URL: ""
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@intermed.local
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proj_internato
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations/002_password_reset_tokens.sql:/docker-entrypoint-initdb.d/02-migration-password-reset-tokens.sql:ro
      - ./db/migrations/003_login_attempts.sql:/docker-entrypoint-initdb.d/03-migration-login-attempts.sql:ro
      - ./db/seed/01_admin.sql:/docker-entrypoint-initdb.d/04-seed-admin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # interface web para visualizar os e-mails enviados
      - "1025:1025" # porta SMTP usada pela aplicação (sem TLS/autenticação)

volumes:
  db_data:
