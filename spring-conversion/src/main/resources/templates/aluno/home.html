<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
        }
        
        main {
            margin-top: 100px;
            padding: 20px;
            margin-left: 80px;
            margin-bottom: 100px;
        }
        
        .navbar {
            background-color: rgb(0, 94, 0);
            height: 100px;
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        
        .navbar-brand,
        .navbar-text {
            color: white;
            font-size: 20px;
        }
        
        .navbar-brand {
            font-size: 30px;
        }
        
        #userDropdown {
            width: 80px;
            height: 80px;
            color: white;
            cursor: pointer;
            object-fit: cover;
        }
        
        #content-main {
            padding: 20px;
            background-color: white;
        }
        
        .footer-home {
            background-color: gray;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            height: 30px;
            bottom: 0;
            z-index: 90;
        }
        
        .navbar .nodec {
            text-decoration: none;
            color: white;
        }
        
        nav.menu-lateral {
            width: 60px;
            height: calc(100vh - 100px);
            background-color: rgb(0, 94, 0);
            position: fixed;
            top: 100px;
            left: 0;
            transition: width 0.2s ease;
            overflow: hidden;
            z-index: 110;
        }
        
        nav.menu-lateral:hover {
            width: 300px;
        }
        
        .ul-menu {
            height: 100%;
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        
        ul li.item-menu {
            transition: 0.2s;
        }
        
        ul li.item-menu:hover {
            background: rgb(0, 60, 0);
        }
        
        ul li.item-menu a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 15px 4%;
            display: flex;
            margin-bottom: 10px;
            line-height: 40px;
        }
        
        ul li.item-menu a .txt-link {
            margin-left: 20px;
        }
        
        ul li.item-menu a .icon > i {
            font-size: 30px;
            margin-left: 10px;
        }
        
        .icone-perfil {
            color: white;
            cursor: pointer;
            font-size: 50px;
            line-height: 30px;
        }
        
        .no-caret::after {
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div th:replace="~{fragments/menu-lateral-aluno :: menu}"></div>
    </header>
    <main>
        <!-- Conteúdo principal vazio, igual ao PHP original -->
    </main>
    <footer>
        <div class="card footer-home rounded-0">
            <div class="card-body">
                <!-- Rodapé vazio, igual ao PHP original -->
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
