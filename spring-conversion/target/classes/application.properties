# Configurações do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/proj_internato
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configurações do servidor
server.port=8080
server.servlet.context-path=/spring
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie

# Configurações do servidor PHP
php.server.url=http://localhost

# Configurações de segurança
server.forward-headers-strategy=native
spring.security.user.name=${spring.datasource.username}
spring.security.user.password=${spring.datasource.password}

# Configurações de recursos estáticos
spring.mvc.static-path-pattern=/static/**

# Configurações do Thymeleaf

# Configurações de logging
logging.level.root=INFO
logging.level.com.interdisciplinar.med=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Configurações de log
logging.level.org.springframework.web=DEBUG
