<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>
    
    <!-- Menu lateral (usando o fragmento) -->
    <th:block th:replace="~{fragments/menu-lateral-preceptor :: menu-lateral}"></th:block>
    
    <main>
        <div class="container mt-3">
            <div class="card">
                <div class="card-body">
                    <!-- Conteúdo dinâmico baseado na página solicitada -->
                    <div th:if="${page == 'realizar-avaliacao'}" th:include="~{preceptor/avaliacoes/realizar-avaliacao :: conteudo}"></div>
                    <div th:if="${page == 'visualizar-avaliacao'}" th:include="~{preceptor/avaliacoes/visualizar-avaliacao :: conteudo}"></div>
                    <div th:if="${page == null or page == 'lista'}" th:include="~{preceptor/avaliacoes/avaliacoes-lista :: conteudo}"></div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="card footer-home rounded-0">
            <div class="card-body">
                <p class="text-center">&copy; 2025 Interdisciplinar-Med</p>
            </div>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
