<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>
    
    <!-- Menu lateral (usando o fragmento) -->
    <th:block th:replace="~{fragments/menu-lateral-preceptor :: menu-lateral}"></th:block>
    <main>
        <div class="container mt-3">
            <div class="card">
                <div class="card-body">
                    <h3>Lista de Alunos</h3>
                    <!-- Filtros -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body py-3">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold"><i class="bi bi-filter"></i> Módulo</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-journal-text"></i></span>
                                        <select id="filtroModulo" class="form-select">
                                            <option value="">Todos</option>
                                            <option th:each="m : ${modulosFiltro}" th:value="${m}" th:text="${m}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold"><i class="bi bi-filter"></i> Subgrupo</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-people"></i></span>
                                        <select id="filtroSubgrupo" class="form-select">
                                            <option value="">Todos</option>
                                            <option th:each="s : ${subgruposFiltro}" th:value="${s}" th:text="${s}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <table id="tabelaAlunos" class="table table-striped table-secondary table-bordered">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Subgrupos</th>
                                <th>Módulos (nota)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunos}" th:attr="data-modulos=${aluno.modulosTexto},data-subgrupo=${aluno.nomeSubgrupo}">
                                <td th:text="${aluno.nome}"></td>
                                <td th:text="${aluno.nomeSubgrupo}"></td>
                                <td th:utext="${aluno.modulosHtml}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alunos)}">
                                <td colspan="3">Nenhum aluno encontrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="card footer-home rounded-0">
            <div class="card-body">
                <p class="text-center">&copy; 2025 Interdisciplinar-Med</p>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selModulo = document.getElementById('filtroModulo');
            const selSub = document.getElementById('filtroSubgrupo');
            const rows = document.querySelectorAll('#tabelaAlunos tbody tr[data-modulos]');
            const applyFilter = () => {
                const mod = selModulo.value.toLowerCase();
                const sub = selSub.value.toLowerCase();
                rows.forEach(r => {
                    const rowMods = r.dataset.modulos.toLowerCase();
                    const rowSub = r.dataset.subgrupo.toLowerCase();
                    // se vários módulos/subgrupos, checar contém
                    const okMod = !mod || rowMods.includes(mod);
                    const okSub = !sub || rowSub.includes(sub);
                    r.style.display = okMod && okSub ? '' : 'none';
                });
            };
            selModulo.addEventListener('change', applyFilter);
            selSub.addEventListener('change', applyFilter);
        });
    </script>
</body>

</html>
