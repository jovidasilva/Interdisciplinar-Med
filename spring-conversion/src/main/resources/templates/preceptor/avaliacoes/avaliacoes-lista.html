<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Fragmento principal que será incluído na página 'avaliacoes.html' -->
    <div th:fragment="conteudo">
        <!-- Toast sucesso -->
        <div th:if="${mensagemSucesso}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1055;">
            <div class="toast text-bg-success border-0 show" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill ms-3 fs-4"></i>
                    <div class="toast-body ms-2 fw-semibold" th:text="${mensagemSucesso}"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            /*[[${mensagemSucesso}]]*/
            const toastEl = document.querySelector('.toast');
            if (toastEl) {
                const toast = bootstrap.Toast.getOrCreateInstance(toastEl, {delay: 10000});
                toast.show();
            }
        </script>

        <h3>Lista de Alunos para Avaliação</h3>

        <!-- Tabela de Alunos -->
        <table class="table table-striped table-secondary table-bordered">
            <thead class="table-secondary">
                <tr>
                    <th>Nome</th>
                    <th>RA</th>
                    <th>Subgrupo</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop para cada aluno retornado pelo controller -->
                <tr th:each="aluno : ${alunos}">
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.registro}"></td>
                    <td th:text="${aluno.nomeSubgrupo}"></td>
                    <td class="text-center">
                        <!-- Se todas as avaliações do aluno estiverem feitas, mostra badge -->
                        <th:block th:if="${#lists.isEmpty(aluno.modulos.?[!avaliado])}">
                            <span class="badge bg-success">Aluno Avaliado</span>
                        </th:block>

                        <!-- Caso contrário, botão para abrir modal de avaliações pendentes -->
                        <th:block th:unless="${#lists.isEmpty(aluno.modulos.?[!avaliado])}">
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" th:data-bs-target="'#modal-aluno-' + ${aluno.aluno_id}">
                                Realizar Avaliação
                            </button>
                        </th:block>
                    </td>
                </tr>
                <!-- Mensagem se a lista de alunos estiver vazia -->
                <tr th:if="${#lists.isEmpty(alunos)}">
                    <td colspan="4" class="text-center">Nenhum aluno encontrado para avaliação.</td>
                </tr>
            </tbody>
        </table>

        <!-- Modais de Módulos (um para cada aluno) -->
        <div th:each="aluno : ${alunos}">
            <div class="modal fade" th:id="'modal-aluno-' + ${aluno.aluno_id}" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalLabel">Módulos de <span th:text="${aluno.nome}"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <ul class="list-group">
                                <!-- Loop para cada módulo do aluno -->
                                <li th:each="modulo : ${aluno.modulos}" class="list-group-item d-flex justify-content-between align-items-center">
                                    <span th:text="${modulo.modulo_nome}"></span>
                                    <!-- Verifica se o módulo já foi avaliado -->
                                    <span th:if="${modulo.avaliado}" class="badge bg-success">Já Avaliado</span>
                                    <!-- Se não foi avaliado, mostra o botão para avaliar -->
                                    <a th:unless="${modulo.avaliado}" 
                                       th:href="@{realizar-avaliacao(id_aluno=${aluno.aluno_id}, id_modulo=${modulo.id_modulo}, aluno_nome=${aluno.nome}, modulo_nome=${modulo.modulo_nome})}" 
                                       class="btn btn-sm btn-outline-primary">Avaliar</a>
                                </li>
                            </ul>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
