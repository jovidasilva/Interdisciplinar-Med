<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes do Subgrupo - Preceptor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>
    
    <!-- Menu lateral (usando o fragmento) -->
    <th:block th:replace="~{fragments/menu-lateral-preceptor :: menu-lateral}"></th:block>
    <main>
        <div class="container mt-3">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 th:text="'Integrantes do Subgrupo ' + ${nomeSubgrupo}"></h3>
                        <a th:href="@{/pages/preceptor/grupos}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                    </div>
                    
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Registro</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunos}">
                                <td th:text="${aluno.nome}"></td>
                                <td th:text="${aluno.registro}"></td>
                                <td>
                                    <span th:if="${aluno.avaliacaoRealizada}" class="badge text-bg-success fs-6 fw-normal p-2">
                                        Avaliado
                                      </span>
                                      <span th:unless="${aluno.avaliacaoRealizada}" class="badge text-bg-warning fs-6 fw-normal p-2">
                                        Não avaliado
                                      </span>
                                      
                                </td>
                                <td>
                                    <a 
                                       th:href="@{/pages/preceptor/avaliacoes/historico(id_aluno=${aluno.idusuario},aluno_nome=${aluno.nome},idsubgrupo=${idsubgrupo})}" 
                                       class="btn btn-info fs-6 fw-normal p-2">
                                        <i class="bi bi-eye"></i> Ver Avaliações
                                    </a>
                                </td>
                                
                            </tr>
                            <tr th:if="${#lists.isEmpty(alunos)}">
                                <td colspan="4">Nenhum aluno encontrado neste subgrupo.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="card footer-home rounded-0">
            <div class="card-body">
                <p class="text-center">&copy; 2025 Interdisciplinar-Med</p>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
