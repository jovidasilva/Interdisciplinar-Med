; Sem isto, o PHP recompila TODOS os arquivos .php a cada requisição (nenhum
; bytecode fica em cache). Combinado com o volume bind-mount do projeto (que
; tem I/O de leitura mais lento, especialmente no Docker Desktop/Windows), a
; primeira requisição a cada página/rota pode demorar visivelmente mais que
; as seguintes — sintoma clássico de "primeiro clique carrega, segundo é
; instantâneo".
;
; opcache.validate_timestamps=1 + revalidate_freq baixo mantém o ambiente de
; desenvolvimento responsivo a mudanças no código (o cache é invalidado
; poucos segundos depois de salvar um arquivo), sem abrir mão do ganho de
; performance do cache de bytecode.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=1
