<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preceptor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
        }
        
        main {
            margin-top: 100px;
            padding: 20px;
            margin-left: 80px;
            margin-bottom: 100px;
        }
        
        .navbar {
            background-color: rgb(0, 94, 0);
            height: 100px;
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        
        .footer-home {
            background-color: rgb(0, 94, 0);
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 50;
        }
        
        /* Botão do menu para dispositivos menores */
        .menu-btn {
            position: fixed;
            top: 110px;
            left: 20px;
            z-index: 120;
            display: none;
        }
        
        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }
            main {
                margin-left: 0;
            }
        }
        
        /* Estilo para o conteúdo principal */
        main {
            margin-left: 80px;
            padding: 20px;
            transition: margin-left 0.2s ease;
        }

        main:hover {
            margin-left: 300px;
        }

        @media (max-width: 768px) {
            main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>
    
    <!-- Menu lateral (usando o fragmento) -->
    <th:block th:replace="fragments/menu-lateral-preceptor :: menu-lateral"></th:block>
    
    <main>
        <!-- Conteúdo principal removido, página inicial sem elementos -->
    </main>
    
    <footer>
        <div class="card footer-home rounded-0">
            <div class="card-body">
                <p class="text-center">&copy; 2025 Interdisciplinar-Med</p>
            </div>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        // Script para abrir/fechar menu em dispositivos menores
        document.getElementById('menuButton').addEventListener('click', function() {
            const menuLateral = document.querySelector('.menu-lateral');
            if (menuLateral.style.width === '250px') {
                menuLateral.style.width = '0';
            } else {
                menuLateral.style.width = '250px';
            }
        });
    </script>
</body>

</html>
