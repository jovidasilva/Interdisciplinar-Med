<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="conteudo">
        <h3>Realizar Avaliação</h3>
        <hr>

        <!-- Displaying student and module information -->
        <div class="mb-4">
            <h5><strong>Aluno:</strong> <span th:text="${aluno_nome}">Nome do Aluno</span></h5>
            <h5><strong>Módulo:</strong> <span th:text="${modulo_nome}">Nome do Módulo</span></h5>
        </div>

        <!-- Evaluation Form -->
        <form th:action="@{/pages/preceptor/avaliacoes/processar-avaliacao}" method="post">
            <!-- Hidden fields -->
            <input type="hidden" name="id_aluno" th:value="${id_aluno}" />
            <!-- Manter subgrupo se existir -->
            <input type="hidden" name="idsubgrupo" th:if="${idsubgrupo != null}" th:value="${idsubgrupo}" />
            <!-- Campo oculto id_modulo -->
            <input type="hidden" name="id_modulo" th:value="${id_modulo}" />

            <!-- Perguntas Dinâmicas -->
            <div th:if="${not #lists.isEmpty(perguntas)}">
                <fieldset class="mb-4" th:each="pergunta, stat : ${perguntas}">
                    <legend th:text="${pergunta.titulo}"></legend>
                    <p th:text="${pergunta.descricao}"></p>

                    <div>
                        <input type="radio" th:id="'insuficiente_' + ${stat.index}" th:name="'pergunta_' + ${stat.index}" value="4" required>
                        <label th:for="'insuficiente_' + ${stat.index}">Insuficiente</label>
                    </div>
                    <div>
                        <input type="radio" th:id="'regular_' + ${stat.index}" th:name="'pergunta_' + ${stat.index}" value="6" required>
                        <label th:for="'regular_' + ${stat.index}">Regular</label>
                    </div>
                    <div>
                        <input type="radio" th:id="'bom_' + ${stat.index}" th:name="'pergunta_' + ${stat.index}" value="8" required>
                        <label th:for="'bom_' + ${stat.index}">Bom</label>
                    </div>
                    <div>
                        <input type="radio" th:id="'excelente_' + ${stat.index}" th:name="'pergunta_' + ${stat.index}" value="10" required>
                        <label th:for="'excelente_' + ${stat.index}">Excelente</label>
                    </div>
                </fieldset>
            </div>

            <div th:if="${#lists.isEmpty(perguntas)}">
                <p>Nenhuma pergunta disponível.</p>
            </div>

            <hr>

            <!-- Botões de ação -->
            <div class="d-flex justify-content-end mt-4">
                <a th:if="${idsubgrupo != null}" th:href="@{/pages/preceptor/grupos/alunos(idsubgrupo=${idsubgrupo})}" class="btn btn-secondary me-2">Voltar Para Subgrupo</a>
                <a th:unless="${idsubgrupo != null}" th:href="@{/pages/preceptor/avaliacoes}" class="btn btn-secondary me-2">Voltar Para Avaliações</a>
                <button id="btnEnviar" type="submit" class="btn btn-primary">Enviar Avaliação</button>
            </div>
        </form>

        <!-- Estilos -->
        <style>
            fieldset {
                background: #f1f4f9;
                border-radius: 5px;
                padding: 1.5rem;
                margin-bottom: 1rem;
                border: 1px solid #dee2e6;
            }
            legend {
                font-weight: bold;
                font-size: 1.2rem;
                color: #333;
                width: auto;
                padding: 0 10px;
            }
        </style>

        <!-- Validação JS -->
        <script th:inline="javascript">
            const form = document.querySelector('form');
            const btn = document.getElementById('btnEnviar');
            btn.addEventListener('click', function(e){
                const fieldsets = form.querySelectorAll('fieldset');
                let valido = true;
                let primeiroInvalido = null;
                fieldsets.forEach(fs => {
                    const radios = fs.querySelectorAll('input[type="radio"]');
                    const nomeGrupo = radios.length ? radios[0].name : null;
                    const respondido = nomeGrupo && form.querySelector('input[name="' + nomeGrupo + '"]:checked');

                    if (!respondido) {
                        valido = false;
                        if (!primeiroInvalido) primeiroInvalido = fs;
                        fs.classList.add('border', 'border-danger');
                        // adiciona texto de erro se ainda não existir
                        if (!fs.querySelector('.invalid-feedback')) {
                            const msg = document.createElement('div');
                            msg.className = 'invalid-feedback d-block fw-semibold';
                            msg.innerText = 'Selecione uma opção';
                            fs.appendChild(msg);
                        }
                    } else {
                        fs.classList.remove('border', 'border-danger');
                        const msg = fs.querySelector('.invalid-feedback');
                        if (msg) msg.remove();
                    }

                    // adiciona listener para limpar erro ao selecionar
                    radios.forEach(r => r.addEventListener('change', () => {
                        fs.classList.remove('border', 'border-danger');
                        const msg = fs.querySelector('.invalid-feedback');
                        if (msg) msg.remove();
                    }, {once:true}));
                });

                if (!valido) {
                    e.preventDefault();
                    primeiroInvalido.scrollIntoView({behavior: 'smooth', block: 'center'});
                    primeiroInvalido.focus();
                }
            });
        </script>
    </div>
</body>
</html>
